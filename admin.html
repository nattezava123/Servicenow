<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่วนผู้ดูแล | ระบบจัดการคลังวัสดุ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebarBackdrop" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="bg-gray-800 text-white w-64 flex-shrink-0 fixed md:static inset-y-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out z-50 shadow-xl flex flex-col">
        <div class="p-4 bg-gray-900 flex justify-between items-center">
            <div class="font-bold text-lg"><i class="fas fa-boxes mr-2"></i> คลังวัสดุ Admin</div>
            <button class="md:hidden text-gray-400" onclick="toggleSidebar()"><i class="fas fa-times text-xl"></i></button>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <button onclick="switchTab('dashboard')" class="w-full text-left p-3 rounded-lg hover:bg-gray-700 transition focus:bg-blue-600"><i class="fas fa-chart-pie w-6"></i> หน้าหลัก</button>
            <button onclick="switchTab('stock')" class="w-full text-left p-3 rounded-lg hover:bg-gray-700 transition focus:bg-blue-600"><i class="fas fa-box w-6"></i> จัดการคลังวัสดุ</button>
            <button onclick="switchTab('approve')" class="w-full text-left p-3 rounded-lg hover:bg-gray-700 transition focus:bg-blue-600"><i class="fas fa-check-circle w-6"></i> อนุมัติการเบิก</button>
            <button onclick="switchTab('users')" class="w-full text-left p-3 rounded-lg hover:bg-gray-700 transition focus:bg-blue-600"><i class="fas fa-users w-6"></i> จัดการพนักงาน</button>
        </nav>
        <div class="p-4 bg-gray-900">
            <button onclick="logout()" class="w-full p-2 bg-red-600 hover:bg-red-700 rounded-lg text-white transition"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Top Navbar for Mobile -->
        <header class="bg-white shadow-sm p-4 flex justify-between items-center md:hidden">
            <button onclick="toggleSidebar()" class="text-gray-600 text-xl"><i class="fas fa-bars"></i></button>
            <h1 class="font-bold text-gray-800" id="mobile-title">แดชบอร์ด</h1>
            <div class="w-6"></div> <!-- Spacer -->
        </header>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-4 md:p-6" id="main-content">
            <!-- Injected by JS -->
        </main>
    </div>

    <script src="db.js"></script>
    <script src="admin.js"></script>
</body>
</html>
