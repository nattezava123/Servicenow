<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviceman AI - Powered by Groq</title>
    
    <!-- เรียกใช้ Tailwind CSS และ FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- เรียกใช้ SweetAlert2 สำหรับ Popup กรอก API Key -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- กรอบแชทหลัก -->
    <div class="bg-white w-full max-w-md h-[650px] rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-slate-200">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-blue-600 p-5 flex items-center gap-4 text-white shadow-md z-10 relative">
            <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm border border-white/30 shadow-inner">
                <i class="fas fa-bolt text-2xl text-yellow-300"></i>
            </div>
            <div>
                <h2 class="text-lg font-black leading-tight">Serviceman AI</h2>
                <p class="text-[10px] text-indigo-100 font-medium uppercase tracking-widest mt-0.5">Powered by Groq Llama 3</p>
            </div>
            
            <!-- ปุ่มตั้งค่า API Key -->
            <button onclick="promptApiKey()" class="ml-auto w-10 h-10 flex items-center justify-center bg-white/20 rounded-full hover:bg-white/30 transition shadow-sm" title="ตั้งค่า API Key">
                <i class="fas fa-cog"></i>
            </button>
        </div>

        <!-- พื้นที่แสดงข้อความแชท -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-5 bg-slate-50 space-y-4 relative">
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-[0.03]">
                <i class="fas fa-robot text-9xl"></i>
            </div>

            <div class="flex items-start gap-3 relative z-10">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-blue-500 flex items-center justify-center text-white shrink-0 shadow-md mt-1">
                    <i class="fas fa-robot text-xs"></i>
                </div>
                <div class="bg-white border border-slate-200 p-4 rounded-[1.2rem] rounded-tl-sm text-sm text-slate-700 shadow-sm max-w-[85%] leading-relaxed">
                    สวัสดีครับ! ⚡<br><br>
                    เพื่อเริ่มใช้งาน กรุณากดที่ <b>ปุ่มรูปฟันเฟือง</b> มุมขวาบน เพื่อใส่ <b>Groq API Key</b> ก่อนนะครับ (ข้อมูลจะถูกเก็บไว้ในเครื่องของคุณเท่านั้น ปลอดภัยแน่นอนครับ)
                </div>
            </div>
        </div>

        <!-- พื้นที่พิมพ์ข้อความ -->
        <div class="p-4 bg-white border-t border-slate-100 z-10">
            <div class="relative flex items-center gap-2">
                <input type="text" id="chat-input" placeholder="พิมพ์ข้อความที่นี่..." 
                       class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-5 pr-14 py-3.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
                       onkeypress="if(event.key === 'Enter') sendMessage()" autocomplete="off">
                <button onclick="sendMessage()" id="send-btn" 
                        class="absolute right-2 aspect-square h-9 bg-indigo-600 text-white rounded-xl flex items-center justify-center hover:bg-indigo-700 transition-all shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-paper-plane text-xs -ml-0.5"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- สคริปต์การทำงาน -->
    <script>
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        // โหลด API Key จาก LocalStorage ถ้ามี
        let currentApiKey = localStorage.getItem('groqApiKey') || '';

        // ฟังก์ชัน Popup ให้กรอก API Key
        function promptApiKey() {
            Swal.fire({
                title: 'ตั้งค่า Groq API Key',
                text: 'กรุณาใส่ API Key ของคุณ (ขึ้นต้นด้วย gsk_)',
                input: 'password', // ปิดบังข้อความตอนพิมพ์เพื่อความปลอดภัย
                inputValue: currentApiKey,
                inputPlaceholder: 'gsk_xxxxxxxxxxxxxxxxxxxx',
                showCancelButton: true,
                confirmButtonText: 'บันทึก',
                cancelButtonText: 'ยกเลิก',
                inputValidator: (value) => {
                    if (!value) {
                        return 'กรุณาใส่ API Key!';
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    currentApiKey = result.value.trim();
                    localStorage.setItem('groqApiKey', currentApiKey); // บันทึกลงเครื่อง
                    Swal.fire({
                        icon: 'success',
                        title: 'บันทึกสำเร็จ!',
                        text: 'ระบบจำ API Key ของคุณแล้ว เริ่มแชทได้เลย',
                        timer: 2000,
                        showConfirmButton: false
                    });
                }
            });
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // ตรวจสอบว่าใส่ API Key หรือยัง
            if (!currentApiKey || !currentApiKey.startsWith('gsk_')) {
                promptApiKey();
                return;
            }

            appendUserMessage(text);
            
            chatInput.value = '';
            chatInput.disabled = true;
            sendBtn.disabled = true;

            const typingId = showTypingIndicator();

            try {
                // ยิง Request ไปหา Groq API ด้วย Key ที่กรอกไว้
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${currentApiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-70b-8192", 
                        messages: [
                            { 
                                role: "system", 
                                content: "คุณคือ Serviceman บอทผู้ช่วยแผนกไอทีในโรงงานอุตสาหกรรม ให้ตอบคำถามเป็นภาษาไทย สั้นๆ กระชับ เข้าใจง่าย เป็นกันเอง หากเจอคำถามที่ซับซ้อนเกินไปให้แนะนำผู้ใช้ไปกรอกข้อมูลแจ้งซ่อมในระบบ" 
                            },
                            { 
                                role: "user", 
                                content: text 
                            }
                        ],
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                if (!response.ok) {
                    if(response.status === 401) throw new Error("Unauthorized");
                    throw new Error("Groq API Error");
                }

                const data = await response.json();
                
                let botReply = data.choices[0].message.content;
                botReply = botReply.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>'); 

                removeTypingIndicator(typingId);
                appendBotMessage(botReply);

            } catch (error) {
                console.error("Error fetching Groq:", error);
                removeTypingIndicator(typingId);
                
                if(error.message === "Unauthorized") {
                    appendBotMessage("<span class='text-rose-600'>API Key ไม่ถูกต้อง หรือหมดอายุ กรุณากดปุ่มฟันเฟืองเพื่อตั้งค่าใหม่ครับ ❌</span>");
                } else {
                    appendBotMessage("<span class='text-rose-600'>ระบบประมวลผลขัดข้อง ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ รบกวนลองใหม่นะครับ 🛠️</span>");
                }
            } finally {
                chatInput.disabled = false;
                sendBtn.disabled = false;
                chatInput.focus();
            }
        }

        // --- ฟังก์ชันวาด UI (เหมือนเดิม) ---
        function appendUserMessage(text) {
            const msgHtml = `
                <div class="flex justify-end mb-4 animate-fade-in relative z-10">
                    <div class="bg-indigo-600 text-white p-4 rounded-[1.2rem] rounded-tr-sm text-sm max-w-[85%] shadow-md border border-indigo-700">
                        ${text}
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', msgHtml);
            scrollToBottom();
        }

        function appendBotMessage(text) {
            const msgHtml = `
                <div class="flex items-start gap-3 mb-4 animate-fade-in relative z-10">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-blue-500 flex items-center justify-center text-white shrink-0 shadow-md mt-1">
                        <i class="fas fa-robot text-xs"></i>
                    </div>
                    <div class="bg-white border border-slate-200 p-4 rounded-[1.2rem] rounded-tl-sm text-sm text-slate-700 shadow-sm max-w-[85%] leading-relaxed">
                        ${text}
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', msgHtml);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const id = 'typing-' + Date.now();
            const typingHtml = `
                <div id="${id}" class="flex items-start gap-3 mb-4 relative z-10">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-slate-200 to-slate-300 flex items-center justify-center text-slate-500 shrink-0 mt-1 shadow-inner">
                        <i class="fas fa-robot text-xs"></i>
                    </div>
                    <div class="bg-white border border-slate-200 p-4 rounded-[1.2rem] rounded-tl-sm shadow-sm flex items-center gap-1.5 h-10">
                        <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                        <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', typingHtml);
            scrollToBottom();
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
