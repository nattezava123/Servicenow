<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Chat AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #chat-container {
            width: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #chat-box {
            height: 500px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 20px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user-msg {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-msg {
            background-color: #e9ecef;
            color: black;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        #input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background: #fff;
        }
        #user-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        button {
            padding: 10px 15px;
            margin-left: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="chat-box">
            <div class="message ai-msg">สวัสดีครับ! ระบบปรับปรุงพร้อมใช้งานแล้ว ลองพิมพ์มาได้เลยครับ</div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="พิมพ์ข้อความที่นี่..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">ส่ง</button>
        </div>
    </div>

    <script>
        // 🔴 1. นำ API Key ของ Google Gemini มาใส่ตรงนี้
        const API_KEY = "AIzaSyBPHkU_VaaS_iraWotJ2q7ziGGOBS7UgL4"; 
        
        // 🟢 2. กำหนดชื่อโมเดล AI (ถ้าเกิด Error อีก ให้ลองเปลี่ยนจาก "gemini-1.5-flash" เป็น "gemini-pro" ดูครับ)
        const MODEL_NAME = "gemini-pro";

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const message = inputField.value.trim();
            if (message === "") return;

            // แสดงข้อความของผู้ใช้
            appendMessage(message, "user-msg");
            inputField.value = "";

            // แสดงข้อความกำลังโหลดของ AI
            const loadingId = appendMessage("กำลังคิด...", "ai-msg");

            try {
                // เรียกใช้งาน API ของ Gemini
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: message }] }]
                    })
                });

                const data = await response.json();

                // ระบบดักจับ Error แบบละเอียด (เช็ค Error จากฝั่ง Google)
                if (!response.ok) {
                    let errorMsg = "เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์";
                    if (data.error && data.error.message) {
                        errorMsg = data.error.message;
                    }
                    throw new Error(errorMsg);
                }
                
                // ดึงข้อความตอบกลับจาก AI
                const aiResponse = data.candidates[0].content.parts[0].text;
                
                // อัปเดตข้อความแทนที่คำว่า "กำลังคิด..."
                document.getElementById(loadingId).innerText = aiResponse;

            } catch (error) {
                // แสดงข้อความ Error บนหน้าแชตให้เห็นชัดๆ
                document.getElementById(loadingId).innerText = "❌ Error: " + error.message;
                console.error("รายละเอียด Error แบบเต็ม:", error);
            }
        }

        // ฟังก์ชันสำหรับเพิ่มข้อความลงในหน้าจอแชต
        function appendMessage(text, className) {
            const chatBox = document.getElementById("chat-box");
            const msgDiv = document.createElement("div");
            const msgId = "msg-" + Date.now();
            
            msgDiv.id = msgId;
            msgDiv.className = "message " + className;
            msgDiv.innerText = text;
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // เลื่อนหน้าจอลงล่างสุดอัตโนมัติ
            
            return msgId;
        }

        // กด Enter เพื่อส่งข้อความได้
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>

</body>
</html>
