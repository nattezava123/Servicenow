<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | ระบบจัดการคลังวัสดุ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <div class="bg-blue-100 text-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-sm">
                🏨
            </div>
            <h1 class="text-2xl font-bold text-gray-800">ระบบจัดการคลังวัสดุ</h1>
            <p class="text-gray-500 text-sm mt-1">แผนกแม่บ้าน (Housekeeping)</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" id="username" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" required placeholder="admin หรือ user1">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน (Password)</label>
                <input type="password" id="password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" required placeholder="123">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg shadow-md transition-all active:scale-95 text-lg">
                เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <script src="db.js"></script>
    <script>
        // Check if already logged in
        const currentUser = getCurrentUser();
        if(currentUser) window.location.href = currentUser.role === 'admin' ? 'admin.html' : 'user.html';

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const users = getDB('hk_users');
            
            const user = users.find(x => x.username === u && x.password === p);
            
            if (user) {
                localStorage.setItem('hk_currentUser', JSON.stringify(user));
                Swal.fire({
                    icon: 'success',
                    title: 'เข้าสู่ระบบสำเร็จ',
                    showConfirmButton: false,
                    timer: 1000
                }).then(() => {
                    window.location.href = user.role === 'admin' ? 'admin.html' : 'user.html';
                });
            } else {
                Swal.fire('ข้อผิดพลาด!', 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง', 'error');
            }
        });
    </script>
</body>
</html>
