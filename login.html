<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | HK System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0f172a', secondary: '#3b82f6' } } } }
    </script>
</head>
<body class="text-slate-800 antialiased h-screen flex overflow-hidden selection:bg-blue-200">

    <div class="w-full h-full flex items-center justify-center bg-slate-900 absolute inset-0 z-50 bg-[url('https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&q=80&w=2000')] bg-cover bg-center">
        <div class="absolute inset-0 bg-slate-900/75 backdrop-blur-sm"></div>
        <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-2xl w-full max-w-md relative z-10 border border-white/20 transform transition-all">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-blue-50 text-blue-600 mb-4 shadow-inner ring-4 ring-blue-50">
                    <i class="fas fa-boxes-packing text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">HK Inventory</h1>
                <p class="text-slate-500 text-sm mt-1">ระบบบริหารจัดการคลังสินค้าแม่บ้าน</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="text" id="login-username" class="w-full pl-11 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-slate-50" placeholder="กรอกชื่อผู้ใช้งาน" required>
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน (Password)</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="password" id="login-password" class="w-full pl-11 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-slate-50" placeholder="กรอกรหัสผ่าน" required>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3.5 rounded-xl transition shadow-lg shadow-blue-500/30 flex justify-center items-center gap-2">
                    เข้าสู่ระบบ <i class="fas fa-arrow-right text-sm"></i>
                </button>
                
                <div class="mt-6 bg-blue-50/70 p-4 rounded-xl border border-blue-100 text-sm text-slate-600">
                    <p class="font-semibold mb-2 text-blue-800"><i class="fas fa-info-circle mr-1"></i> บัญชีทดสอบระบบ:</p>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-white p-2 rounded-lg border border-blue-100 shadow-sm"><strong>Admin:</strong> admin / admin</div>
                        <div class="bg-white p-2 rounded-lg border border-blue-100 shadow-sm"><strong>User:</strong> user / user</div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="db.js"></script>
    <script>
        checkAuth(); // ถ้า Login แล้วจะวิ่งไปหน้า admin/user อัตโนมัติ

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            
            const user = db.users.find(x => x.username === u && x.password === p);
            if (user) {
                localStorage.setItem('hk_curr_user', JSON.stringify(user));
                window.location.href = user.role === 'admin' ? 'admin.html' : 'user.html';
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'เข้าสู่ระบบล้มเหลว',
                    text: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',
                    confirmButtonColor: '#3b82f6'
                });
            }
        }
    </script>
</body>
</html>
